<!DOCTYPE html>
<html lang="en">

<style>
:root{--bg:#0e1e24;--p1:#12242c;--p2:#172a32;--line:#1f2937;--mut:#8a94a0;--sub:#9ca3af;--g:#00c805;--amb:#ffb700;--blue:#0094ff;--org:#ff5000;--gen:linear-gradient(145deg,#3b4046,#1b1e22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
body{min-height:100vh;max-width:430px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(170px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button,input,select,textarea{font:inherit}
button{color:inherit}
input,textarea{user-select:text;-webkit-user-select:text}
[hidden]{display:none!important}
.view:not([hidden]){animation:fadein .25s}
@keyframes fadein{from{opacity:0}}

/* ---------- header ---------- */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500;margin-bottom:6px}
.tot{display:flex;align-items:baseline;gap:4px;color:#fff}.tot i{font-style:normal;font-size:20px;color:var(--sub)}.tot b{font-size:38px;font-weight:500;letter-spacing:-.02em}
.pill{display:flex;align-items:center;gap:6px;background:var(--p2);border:.5px solid var(--line);border-radius:999px;padding:0 14px;min-height:44px;margin-top:-6px;color:var(--sub);font-size:11px;font-family:ui-monospace,Menlo,monospace;cursor:pointer}
.pill s{width:8px;height:8px;border-radius:50%;background:var(--g);text-decoration:none}.pill.w s{background:var(--amb)}.pill.e s{background:var(--org)}
.dn{font-size:13px;color:var(--sub);font-weight:500}.dd{font-size:22px;color:#fff;font-weight:500;margin-top:2px}
.empty{color:var(--mut);font-size:14px;padding:40px 0;text-align:center}

/* ---------- home + expenses panels ---------- */
.n-card{display:block;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;color:inherit;cursor:pointer}
.n-card.still{cursor:default}
.n-row{display:flex;justify-content:space-between;align-items:center}
.n-big{display:flex;align-items:baseline;gap:4px;color:#fff;margin:6px 0 14px}.n-big i{font-style:normal;font-size:22px;color:var(--sub)}.n-big b{font-size:44px;font-weight:500;letter-spacing:-.02em}
.n-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--p2)}.n-bar i{display:block;height:100%}
.n-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12px;color:var(--sub)}.n-leg span{display:flex;align-items:center;gap:6px}.n-leg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.n-date{font-size:12px;color:var(--amb);font-weight:500}
.n-count{display:flex;align-items:baseline;gap:8px;margin-top:8px}.n-count b{font-size:46px;font-weight:500;color:#fff;letter-spacing:-.02em;line-height:1}.n-count span{font-size:18px;color:#d1d5db}
.n-sub{font-size:14px;color:#d1d5db;margin-top:4px}
.n-prog{margin:16px 0 8px;height:8px;border-radius:4px;background:var(--p2);overflow:hidden}.n-prog i{display:block;height:100%;background:var(--amb);border-radius:4px}
.n-ends{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}
.n-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.n-chip{display:flex;align-items:center;gap:6px;background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:12px;color:#d1d5db;max-width:100%}.n-chip i{width:10px;height:7px;border-radius:2px;display:inline-block;flex-shrink:0}.n-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-next.urgent{border-color:rgba(255,183,0,.45)}
.n-none{font-size:14px;color:var(--sub);line-height:1.5;margin-top:8px}
.n-maaT{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:500}.n-maaT i{width:6px;height:6px;border-radius:50%;background:var(--g)}
.n-pm{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}.n-pm.m{background:#2a1215;border:1px solid #7f1d1d;color:#fecaca}.n-pm.p{background:#0f2a1d;border:1px solid #166534;color:#86efac}.n-pm:active{transform:scale(.95)}
.n-tile{text-align:left;background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}.n-tile small{display:block;font-size:11px;color:var(--sub);margin-bottom:4px}.n-tile b{font-size:18px;color:#fff;font-weight:500}
.n-h{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:14px}
.n-wrow{display:flex;align-items:center;gap:16px}
.n-donut{position:relative;width:128px;height:128px;flex-shrink:0}.n-donut svg{display:block;transform:rotate(-90deg)}
.n-dc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.n-dc b{font-size:22px;color:#fff;font-weight:500}.n-dc small{font-size:11px;color:var(--sub)}
.n-lg{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;font-size:12px}.n-lg div{display:flex;align-items:center;gap:8px}.n-lg i{width:8px;height:8px;border-radius:50%;flex-shrink:0}.n-lg span{color:#d1d5db;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n-lg em{font-style:normal;color:var(--sub);font-family:ui-monospace,Menlo,monospace;font-size:11px}
.n-mrow{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--p1);border:1px solid rgba(20,83,45,.6);border-radius:14px;padding:14px;margin-bottom:6px;min-height:44px;cursor:pointer;text-align:left}
.n-mrow span:first-child{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;color:#e5e7eb}.n-mrow i{width:10px;height:10px;border-radius:50%;background:var(--g)}
.xr{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 6px;background:none;border:0;border-bottom:1px solid var(--line);min-height:44px;text-align:left;cursor:pointer}
.xr .xl{display:flex;align-items:flex-start;gap:12px;min-width:0;flex:1}.xr .xd{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0}
.xr b{display:flex;align-items:center;font-size:14px;color:#e5e7eb;font-weight:500}.xr b span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr small{display:block;font-size:12px;color:var(--sub);font-style:italic;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.xr .xt{min-width:0}
.xa{font:600 14px ui-monospace,Menlo,monospace;color:#fff;background:var(--p2);border-radius:6px;padding:2px 8px;flex-shrink:0}
.xr.off{opacity:.5}.badge{font-size:9px;padding:2px 6px;border-radius:4px;background:var(--line);color:#d1d5db;text-transform:uppercase;letter-spacing:.05em;margin-left:8px;flex-shrink:0}
.xr .chev{color:var(--sub);transition:transform .2s;display:flex}.xr .chev.up{transform:rotate(180deg)}
.xs{padding:0 4px 14px 28px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.si{display:flex;align-items:center;justify-content:space-between;background:#0b171c;border-radius:10px;padding:6px 6px 6px 12px;font-size:14px;min-height:44px;gap:8px}.si span:first-child{color:#d1d5db;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .r{display:flex;align-items:center;gap:2px;flex-shrink:0}.si .r span{font-family:ui-monospace,Menlo,monospace;color:var(--sub)}
.si button{background:none;border:0;color:#f87171;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.xs .none{font-size:12px;color:var(--mut);font-style:italic;padding:4px 2px}
.sub-add{display:flex;gap:8px;padding-top:4px}
.sub-add input{margin:0;height:44px;min-width:0;padding:0 10px;font-size:14px;border-radius:10px;background:#0b171c}.sub-add .sn{flex:1}.sub-add .sa{width:78px;flex:none;font-family:ui-monospace,Menlo,monospace}
.sub-add button{height:44px;padding:0 14px;border:0;border-radius:10px;background:var(--g);color:#000;font-size:14px;font-weight:600;cursor:pointer}

/* ---------- cards tab (stacked wallet) ---------- */
#cCount{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:12px}
.card{aspect-ratio:1.586;border-radius:16px;padding:14px 16px;position:relative;border-top:.5px solid rgba(255,255,255,.2);transition:transform .15s}
#cStack{container-type:inline-size}#cStack .card+.card{margin-top:calc(50px - 63.05cqw)}
.card .nm{font-size:15px;font-weight:500}.card.ph .nm,.card.ph .num{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.card .bt{position:absolute;left:16px;bottom:16px}
.chip{width:34px;height:26px;border-radius:5px;background:currentColor;opacity:.35;margin-bottom:12px}
.num{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.14em}
.card.lift{transition:none;z-index:5;outline:1.5px solid var(--g);scale:1.03}
.card.big{margin:0 auto 18px;max-width:360px}
#fab{position:fixed;right:max(16px,calc((100vw - 430px)/2 + 16px));bottom:calc(14px + env(safe-area-inset-bottom));z-index:46;width:70px;height:70px;border:0;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(120% 90% at 28% 8%,rgba(255,255,255,.34),rgba(255,255,255,0) 50%),rgba(0,205,8,.16);
  -webkit-backdrop-filter:blur(6px) saturate(170%) brightness(1.05);backdrop-filter:blur(6px) saturate(170%) brightness(1.05);filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));
  box-shadow:inset 0 12px 18px -14px rgba(255,255,255,.34),inset 0 -14px 20px -14px rgba(255,255,255,.14),inset 0 0 22px rgba(255,255,255,.06),0 14px 34px rgba(0,0,0,.38)}
#fab:active{transform:scale(.95)}
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 16px 40px;visibility:hidden;opacity:0;transform:translateX(28px);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .22s,visibility 0s .3s}
.ov.on{visibility:visible;opacity:1;transform:none;transition-delay:0s}.ov>div{max-width:430px;margin:0 auto}
.sh{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;visibility:hidden;opacity:0;transition:opacity .22s,visibility 0s .3s}
.sh.on{visibility:visible;opacity:1;transition-delay:0s}.sh>div{transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}.sh.on>div{transform:none}
.sh>div{background:var(--p1);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));user-select:text;-webkit-user-select:text}
.sh h2{margin:0 0 14px;font-size:18px;font-weight:500;color:#fff}.sh p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.5}
.sh a{color:var(--g)}
.sh.cf{z-index:90;align-items:center;padding:16px}.sh.cf>div{max-width:320px;border-radius:20px;padding:20px;transform:translateY(16px)}.sh.cf.on>div{transform:none}
.sh.cf p{font-size:15px;color:#e5e7eb;text-align:center;margin:0 0 18px}
.cfb{display:flex;gap:8px}.cfb .btn{margin-top:0}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.lk{background:none;border:0;color:var(--g);font-size:14px;font-weight:500;display:flex;align-items:center;gap:4px;padding:0;cursor:pointer;min-height:44px}.lk.m{color:var(--sub)}
.panel{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:6px 16px}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:.5px solid var(--line)}.row:last-child{border:0}
.ic{width:36px;height:36px;border-radius:10px;background:var(--p2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rm{flex:1}.row .lab{font-size:12px;color:var(--mut);margin-bottom:2px}.row .val{font-size:16px;color:#fff;font-weight:500}.row .val.L{font-size:20px}
.rr{text-align:right;font-size:13px;color:#d1d5db}.rr .s{font-size:11px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 5px}
input,textarea{width:100%;background:var(--bg);border:.5px solid var(--line);border-radius:12px;padding:12px;color:#fff;font-size:16px;margin-bottom:12px;min-width:0;display:block;text-align:left;-webkit-appearance:none;appearance:none}
input{height:46px}
textarea{resize:none;font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--mut)}
input:focus,textarea:focus{outline:1px solid var(--g);border-color:var(--g)}
input[type=file]{height:auto;padding:9px;font-size:14px;color:var(--sub)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer}.sw button.on{border-color:#fff}
.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;background:var(--g);color:#000;margin-top:4px;min-height:46px}
.btn.s{background:var(--p2);color:#e5e7eb}.btn.d{background:none;color:var(--org)}
.btn.d2{background:#2a1215;border:1px solid #7f1d1d;color:#fecaca}
.btn.mini{width:auto;padding:0 16px;margin:0;font-size:13px;height:46px;flex-shrink:0}
.cprow{display:flex;gap:8px;margin-bottom:12px}.cprow input{margin:0;flex:1}
.stat{min-height:1.2em;font-size:12px;margin:0 0 12px}
.stat.ok{color:var(--g)}.stat.bad{color:#f87171}
.card.big.ph{padding:0;aspect-ratio:auto;border-top:0;width:fit-content}.card.big.ph img{max-width:100%;max-height:230px;width:auto;display:block;border-radius:16px}.card.big.ph .nm{position:absolute;left:16px;top:14px}
.eye{position:absolute;right:12px;top:10px;background:none;border:0;color:inherit;padding:4px;display:flex;cursor:pointer;min-width:44px;min-height:44px;align-items:center;justify-content:center}
.rv{position:absolute;inset:0;border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between}.rt{display:flex;justify-content:space-between;align-items:center}
.card.big.ph .rv .nm{position:static}.rn{font-size:17px;letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}.cp{background:none;border:0;color:inherit;opacity:.85;padding:4px;display:flex;cursor:pointer}.ex>div{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}.ex small{width:100%}.ex{display:flex;gap:28px;font-family:ui-monospace,Menlo,monospace;font-size:13px}.ex small{display:block;font-size:10px;opacity:.7}
.ttl{font-size:15px;font-weight:500;color:#fff;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cap{font-size:12px;color:var(--mut);text-align:center;margin:-8px 0 14px}#cap:empty{display:none}
#cSum{background:var(--p1);border:.5px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:16px}#cSum:empty{display:none}
.sr{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:.5px solid var(--line)}.sr:last-child{border:0}.sr .ic{width:32px;height:32px;border-radius:9px}.sr b{display:block;font-size:14px;color:#fff;font-weight:500}.sr small{font-size:12px;color:var(--sub)}
#pin{z-index:70}.dots{display:flex;justify-content:center;gap:14px;margin:0 0 18px}.dots span{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--mut)}.dots span.f{background:var(--g);border-color:var(--g)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}.pad button{background:var(--p2);border:0;border-radius:12px;padding:12px 0;font-size:22px;color:#fff;cursor:pointer;min-height:48px}.pad .gh{background:none;font-size:14px;color:var(--sub)}

input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}input[type=date]::-webkit-datetime-edit{padding:0}.two>div{min-width:0}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
.ov .panel{animation:up .38s .1s cubic-bezier(.2,.8,.2,1) both}.ov .card.big{animation:up .36s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;transition-delay:0s!important}}
/* ---------- bottom bar: Liquid Glass inspired ---------- */
#tabs{position:fixed;left:max(0px,calc((100vw - 430px)/2));width:min(100vw,430px);bottom:0;z-index:45;pointer-events:none;padding:0 0 calc(14px + env(safe-area-inset-bottom))}
#tabsIn{pointer-events:auto;touch-action:none;position:relative;margin:0 0 0 16px;width:calc(100% - 120px);padding:6px;border-radius:42px;
  transition:width .3s cubic-bezier(.3,.9,.3,1),scale .3s cubic-bezier(.3,.9,.3,1);
  background:rgba(255,255,255,.012);
  -webkit-backdrop-filter:blur(6px) saturate(170%) brightness(1.05);backdrop-filter:blur(6px) saturate(170%) brightness(1.05);
  box-shadow:inset 0 1px 2px -1px rgba(255,255,255,.22),inset 0 -1px 2px -1px rgba(255,255,255,.1),inset 0 0 22px rgba(255,255,255,.035),0 12px 30px rgba(0,0,0,.3)}
/* light catching the glass edge: bright only at two corners, never a full outline */
#tabsIn::before,#fab::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;z-index:3;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0) 14%,rgba(255,255,255,0) 84%,rgba(255,255,255,.34));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
#tabs.home #tabsIn{width:calc(100% - 32px)}
#tabsIn.lift{scale:1.045}
.tbr{position:relative;z-index:1;display:flex;--hl:0px;--hr:0px;--ha:0;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(var(--hl) - 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hl) + 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hr) - 7px),#000 calc(var(--hr) + 7px));
  mask-image:linear-gradient(90deg,#000 calc(var(--hl) - 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hl) + 7px),rgba(0,0,0,calc(1 - var(--ha))) calc(var(--hr) - 7px),#000 calc(var(--hr) + 7px))}
/* resting highlight: a glass capsule behind the selected tab */
.tbi{position:absolute;left:0;top:10px;height:50px;width:60px;border-radius:999px;pointer-events:none;z-index:0;overflow:hidden;
  background:rgba(255,255,255,.015);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.4),inset 0 -1px 1px rgba(255,255,255,.22),inset 7px 0 11px -7px rgba(255,120,150,.4),inset -7px 0 11px -7px rgba(90,200,255,.4),inset 0 0 12px rgba(255,255,255,.05),0 3px 8px rgba(0,0,0,.2);will-change:transform,width}
.tbi::after{content:"";position:absolute;left:12%;right:12%;top:2px;height:26%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
/* pressed: a clear glass lens follows the finger and magnifies what is under it */
.tbl{position:absolute;left:0;top:0;height:60px;width:80px;border-radius:999px;pointer-events:none;z-index:2;overflow:hidden;opacity:0;will-change:transform,width;
  -webkit-backdrop-filter:brightness(1.12) saturate(140%);backdrop-filter:brightness(1.12) saturate(140%);
  box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 9px 10px -6px rgba(0,0,0,.6),inset 0 -9px 10px -6px rgba(0,0,0,.6),
    inset 10px 0 12px -8px rgba(255,70,90,.6),inset 20px 0 16px -14px rgba(70,150,255,.55),

/* ---------- dates ---------- */
const DAY = 864e5;
const today = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const clampDay = (y, m, day) => new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
/* next date (today counts) with this day-of-month */
function nxt(day) {
  const t = today();
  for (let o = 0; o < 3; o++) { const d = clampDay(t.getFullYear(), t.getMonth() + o, day); if (d >= t) return d; }
}
/* most recent date with this day-of-month; strict = must be before today */
function prevDate(day, strict) {
  const t = today();
  for (let o = 0; o < 3; o++) {
    const d = clampDay(t.getFullYear(), t.getMonth() - o, day);
    if (strict ? d < t : d <= t) return d;
  }
}
const daysUntil = d => Math.round((d - today()) / DAY);
const inDays = d => { const n = daysUntil(d); return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; };
const short = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const ord = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
function pd(s) { const [a, b, c] = s.split('-').map(Number); return new Date(a, b - 1, c); }
function age(s) {
  const o = pd(s), n = new Date();
  const m = (n.getFullYear() - o.getFullYear()) * 12 + n.getMonth() - o.getMonth() - (n.getDate() < o.getDate() ? 1 : 0);
  if (m < 1) return 'New';
  const y = Math.floor(m / 12);
  return (y ? y + ' yr ' : '') + (m % 12) + ' mo';
}
const tstr = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

/* ---------- data store ---------- */
const KEY = 'et_data_v1';
/* Home cards, in their default order. The first two are shown large, the rest small. */
const HOME_KEYS = ['exp', 'next', 'maa', 'paid', 'lim'];
function homeOrder(o) {
  const out = [];
  (Array.isArray(o) ? o : []).forEach(k => { if (HOME_KEYS.indexOf(k) >= 0 && out.indexOf(k) < 0) out.push(k); });
  HOME_KEYS.forEach(k => { if (out.indexOf(k) < 0) out.push(k); });
  return out;
}
const EMPTY = () => ({
  expenses: [],
  maaser: { amount: 0, history: [], updatedAt: 0 },
  home: { order: HOME_KEYS.slice(), updatedAt: 0 },
  cards: [],
  payments: [],
  deleted: { expenses: {}, cards: {}, payments: {} },
  dirty: { expenses: false, cards: false, payments: false }
});
let S = EMPTY();
function sortCards() { S.cards.sort((a, b) => ((a.pos || 0) - (b.pos || 0)) || (a.id < b.id ? -1 : a.id > b.id ? 1 : 0)); }
function loadState() {
  try {
    const j = JSON.parse(LS.get(KEY) || 'null');
    if (j && typeof j === 'object') {
      S = Object.assign(EMPTY(), j);
      /* fill in anything missing so a partial record can never crash a later edit */
      ['expenses', 'cards', 'payments'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
      S.deleted = Object.assign(EMPTY().deleted, j.deleted || {});
      S.dirty = Object.assign(EMPTY().dirty, j.dirty || {});
      S.maaser = Object.assign(EMPTY().maaser, j.maaser || {});
      ['expenses', 'cards', 'payments'].forEach(k => { if (!S.deleted[k] || typeof S.deleted[k] !== 'object') S.deleted[k] = {}; });
      if (!Array.isArray(S.maaser.history)) S.maaser.history = [];
      S.home = { order: homeOrder(j.home && j.home.order), updatedAt: (j.home && +j.home.updatedAt) || 0 };
    }
  } catch (e) { S = EMPTY(); }
  sortCards();
}
function saveState() { LS.set(KEY, JSON.stringify(S)); }

/* render hook is filled in by main.js */
const hooks = { render() {} };
/* kind: 'expenses' (includes Maaser) | 'cards' | 'payments' */
function commit(kind) {
  S.dirty[kind] = true;
  saveState();
  hooks.render();
  Sync.schedule();
}
function removeItem(kind, id) {
  S[kind] = S[kind].filter(x => x.id !== id);
  S.deleted[kind][id] = nowTs();
  commit(kind);
}

/* =====================================================================
   Sync: one private gist, three files, per-item merge by timestamp
   ===================================================================== */
const GH = 'https://api.github.com';
const FILES = { expenses: 'expenses.json', cards: 'cards.json', payments: 'payments.json' };
const TOMB_TTL = 90 * DAY;

/* stable stringify (sorted keys) so equal data always compares equal */
function canon(v) {
  if (v === undefined) return 'null';
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(canon).join(',') + ']';
  return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + canon(v[k])).join(',') + '}';
}

/* union by id, newest updatedAt wins, deletions are remembered as tombstones */
function mergeList(local, remote, tLocal, tRemote) {
  const tombs = Object.assign({}, tRemote || {});
  Object.keys(tLocal || {}).forEach(id => { tombs[id] = Math.max(tombs[id] || 0, tLocal[id]); });
  const t = nowTs();
  Object.keys(tombs).forEach(id => { if (t - tombs[id] > TOMB_TTL) delete tombs[id]; });
  const map = {};
  (remote || []).forEach(it => { if (it && it.id) map[it.id] = it; });
  (local || []).forEach(it => { if (it && it.id && (!map[it.id] || (it.updatedAt || 0) > (map[it.id].updatedAt || 0))) map[it.id] = it; });
  const items = Object.keys(map).map(id => map[id]).filter(it => !(tombs[it.id] && tombs[it.id] >= (it.updatedAt || 0)));
  items.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
  return { items, tombs };
}

const Sync = {
  etag: null, busy: false, again: false, timer: null, lastRemote: null,
  token() { return LS.get('et_token') || ''; },
  gist() { return LS.get('et_gist') || ''; },
  connected() { return !!(this.token() && this.gist()); },

  status(text, cls) {
    $$('.syncT').forEach(x => { x.textContent = text; });
    $$('.pill').forEach(x => { x.className = 'pill sync-open' + (cls ? ' ' + cls : ''); });
  },
  headers() {
    return { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + this.token(), 'Content-Type': 'application/json' };
  },

  serialize(kind) {
    if (kind === 'expenses') return { version: 1, expenses: S.expenses, maaser: S.maaser, home: S.home, deleted: S.deleted.expenses };
    if (kind === 'cards') return { version: 1, cards: S.cards, deleted: S.deleted.cards };
    return { version: 2, payments: S.payments, deleted: S.deleted.payments };
  },

  /* merge what is in the gist into local data; returns true if anything visible changed */
  mergeIn(remote) {
    const before = canon({ e: S.expenses, m: S.maaser, h: S.home, c: S.cards, p: S.payments });
    const rx = remote.expenses || {}, rc = remote.cards || {}, rp = remote.payments || {};
    const e = mergeList(S.expenses, rx.expenses, S.deleted.expenses, rx.deleted);
    S.expenses = e.items; S.deleted.expenses = e.tombs;
    if (rx.maaser && typeof rx.maaser === 'object' && (rx.maaser.updatedAt || 0) > (S.maaser.updatedAt || 0)) {
      S.maaser = Object.assign({ amount: 0, history: [], updatedAt: 0 }, rx.maaser);
    }
    if (rx.home && typeof rx.home === 'object' && (+rx.home.updatedAt || 0) > (S.home.updatedAt || 0)) {
      S.home = { order: homeOrder(rx.home.order), updatedAt: +rx.home.updatedAt };
    }
    const c = mergeList(S.cards, rc.cards, S.deleted.cards, rc.deleted);
    S.cards = c.items; S.deleted.cards = c.tombs; sortCards();
    const p = mergeList(S.payments, rp.payments, S.deleted.payments, rp.deleted);
    S.payments = p.items; S.deleted.payments = p.tombs;
    return before !== canon({ e: S.expenses, m: S.maaser, h: S.home, c: S.cards, p: S.payments });
  },

  async parseFiles(j) {
    const out = {};
    for (const k of Object.keys(FILES)) {
      const f = j.files && j.files[FILES[k]];
      if (!f) continue;
      let txt = f.content;
      if (f.truncated) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
      try { out[k] = JSON.parse(txt || 'null') || undefined; }
      catch (e) { throw new Error('data-corrupt'); }
    }
    return out;
  },

  async createGist(token) {
    const files = {};
    Object.keys(FILES).forEach(k => { files[FILES[k]] = { content: JSON.stringify(this.serialize(k)) }; });
    const res = await fetch(GH + '/gists', {
      method: 'POST',
      headers: { Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: 'ExpenseTracker data (private). Do not delete.', public: false, files })
    });
    if (res.status === 401) throw new Error('GitHub rejected that token.');
    if (res.status === 403 || res.status === 404) throw new Error('The token needs the gist permission.');
    if (!res.ok) throw new Error('GitHub error ' + res.status + '.');
    return (await res.json()).id;
  },

  /* returns 'ok' or a short message describing what went wrong */
  async run() {
    if (!this.connected()) { this.status('Not connected', 'e'); return 'Not connected'; }
    if (this.busy) { this.again = true; return 'busy'; }
    this.busy = true;
    this.status('Syncing', 'w');
    let result = 'ok';
    try {
      const h = this.headers();
      if (this.etag) h['If-None-Match'] = this.etag;
      const r = await fetch(GH + '/gists/' + this.gist(), { headers: h, cache: 'no-store' });
      if (r.status === 401) { this.status('Token expired', 'e'); return (result = 'GitHub rejected that token.'); }
      if (r.status === 404) { this.status('Gist not found', 'e'); return (result = 'No gist with that ID was found for this token.'); }
      if (r.status === 403 || r.status === 429) { this.status('Rate limited', 'e'); return (result = 'GitHub is limiting requests. Try again in a few minutes.'); }
      let remote = this.lastRemote || {};
      if (r.status === 200) {
        this.etag = r.headers.get('ETag') || null;
        remote = await this.parseFiles(await r.json());
        this.lastRemote = remote;
        const changed = this.mergeIn(remote);
        saveState();
        if (changed) hooks.render(true);
      } else if (r.status !== 304) {
        throw new Error('HTTP ' + r.status);
      }
      /* push whatever the gist does not already have */
      const files = {}, pushed = {};
      Object.keys(FILES).forEach(k => {
        const mine = this.serialize(k);
        if (S.dirty[k] || canon(mine) !== canon(remote[k])) { files[FILES[k]] = { content: JSON.stringify(mine) }; pushed[k] = mine; }
      });
      if (Object.keys(files).length) {
        const pr = await fetch(GH + '/gists/' + this.gist(), { method: 'PATCH', headers: this.headers(), body: JSON.stringify({ files }) });
        if (pr.status === 401) { this.status('Token expired', 'e'); return (result = 'GitHub rejected that token.'); }
        if (!pr.ok) throw new Error('HTTP ' + pr.status);
        this.etag = pr.headers.get('ETag') || null;
        Object.keys(pushed).forEach(k => { remote[k] = pushed[k]; S.dirty[k] = false; });
        this.lastRemote = remote;
        saveState();
      }
      this.status('Synced', '');
    } catch (e) {
      if (e && e.message === 'data-corrupt') { this.status('Data error', 'e'); result = 'The gist data could not be read, so nothing was changed.'; }
      else { this.status(navigator.onLine === false ? 'Offline' : 'Not saved', 'e'); result = 'Could not reach GitHub.'; }
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; setTimeout(() => this.run(), 50); }
    }
    return result;
  },

  schedule() {
    clearTimeout(this.timer);
    if (!this.connected()) { this.status('Not connected', 'e'); return; }
    this.timer = setTimeout(() => this.run(), 400);
  },

  async connect(token, gistId) {
    if (!gistId) gistId = await this.createGist(token);
    LS.set('et_token', token); LS.set('et_gist', gistId);
    this.etag = null; this.lastRemote = null;
    const r = await this.run();
    if (r !== 'ok') throw new Error(r);
  },

  disconnect() {
    LS.del('et_token'); LS.del('et_gist');
    this.etag = null; this.lastRemote = null;
    this.status('Not connected', 'e');
  }
};

function confirmDlg(message, okText) {
  return new Promise(resolve => {

}

/* =====================================================================
   Home: expense total, Next up countdown, compact Maaser, tiles
   ===================================================================== */
const weekdayDate = d => d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

/* The nearest payment due date, the cards due on it, and where we are since the last statement */
function nextUpInfo() {
  const withDue = S.cards.filter(c => +c.dueDay > 0);
  if (!withDue.length) return null;
  const items = withDue.map(c => ({ c, d: nxt(+c.dueDay) }));
  const min = Math.min(...items.map(i => +i.d));
  const group = items.filter(i => +i.d === min).map(i => i.c);
  const due = new Date(min);
  const days = daysUntil(due);
  let stmt = null, prevDue = null;
  group.forEach(c => {
    if (+c.stmtDay > 0) { const s = prevDate(+c.stmtDay, false); if (s && (!stmt || s > stmt)) stmt = s; }
    const p = prevDate(+c.dueDay, true); if (p && (!prevDue || p > prevDue)) prevDue = p;
  });
  let frac = null;
  /* only draw the bar when a statement has closed since the last due date */
  if (stmt && due > stmt && (!prevDue || stmt >= prevDue)) {
    frac = Math.max(0, Math.min(1, (today() - stmt) / (due - stmt)));
  }
  /* cards that fall due on the next different date after this one */
  const later = items.filter(i => +i.d > min);
  let then = null;
  if (later.length) {
    const m2 = Math.min(...later.map(i => +i.d));
    then = { d: new Date(m2), cards: later.filter(i => +i.d === m2).map(i => i.c) };
  }
  return { group, due, days, stmt: frac == null ? null : stmt, frac, then };
}

function renderNextUp() {
  const host = $('#hNext');
  const info = nextUpInfo();
  if (!info) {
    host.innerHTML = `<button class="n-card n-next" type="button" data-go="cards">
      <div class="n-row"><span class="lbl" style="margin:0">Next up</span></div>
      <div class="n-none">${S.cards.length ? 'Add a payment due day to a card to see a countdown here.' : 'Add a card to see when your next payment is due.'}</div></button>`;
    return;
  }
  const { group, due, days, stmt, frac, then } = info;
  const many = group.length > 1;
  const count = days === 0 ? '<b>Today</b>' : `<b>${days}</b><span>${days === 1 ? 'day' : 'days'}</span>`;
  const sub = days === 0 ? (many ? 'Payments are due today' : 'Payment is due today') : (many ? 'until payments are due' : 'until payment is due');
  const bar = frac == null ? '' : `<div class="n-prog" aria-hidden="true"><i style="width:${(frac * 100).toFixed(1)}%"></i></div>
      <div class="n-ends"><span>${many ? 'Statements' : 'Statement'} closed ${esc(short(stmt))}</span><span>Due ${esc(short(due))}</span></div>`;
  const chips = group.map(c => `<span class="n-chip"><i style="background:${esc(cCol(c.id))}"></i><span>${esc(lbl(c))}</span></span>`).join('');
  host.innerHTML = `<button class="n-card n-next${days <= 3 ? ' urgent' : ''}" type="button" data-go="cards" aria-label="Next payment due ${esc(weekdayDate(due))}. Open Cards">
    <div class="n-row"><span class="lbl" style="margin:0">Next up</span><span class="n-date">${esc(weekdayDate(due))}</span></div>
    <div class="n-count">${count}</div>
    <div class="n-sub">${sub}</div>
    ${bar}
    <div class="n-chips">${chips}</div>
    ${then ? `<div class="n-then">Then ${esc(short(then.d))}: ${then.cards.map(c => esc(lbl(c))).join(', ')}</div>` : ''}</button>`;
}

function renderHome() {
  const d = new Date();
  $('#hDay').textContent = d.toLocaleDateString('en-US', { weekday: 'long' });
  $('#hDate').textContent = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  const act = activeExp(), tot = totalExp();
  $('#hTotal').textContent = nf(tot);
  if (!act.length) {
    $('#hBar').innerHTML = '';
    $('#hLeg').innerHTML = '<span>Add your first expense in the Expenses tab</span>';
  } else {
    const cols = EXP_COLORS;
    const pct = e => e.amount / tot * 100;
    const segs = act.slice(0, 2).map((e, i) => ({ w: pct(e), c: cols[i], t: e.desc, p: Math.round(pct(e)) }));
    const rest = act.slice(2);
    if (rest.length) { const w = rest.reduce((s, e) => s + pct(e), 0); segs.push({ w, c: cols[3], t: plural(rest.length, 'other'), p: Math.round(w) }); }
    $('#hBar').innerHTML = segs.map(s => `<i style="width:${s.w.toFixed(2)}%;background:${s.c}"></i>`).join('');
    $('#hLeg').innerHTML = segs.map(s => `<span><i style="background:${s.c}"></i>${esc(s.t)} ${s.p}%</span>`).join('');
  }

  renderNextUp();
  $('#hMaa').textContent = mf(S.maaser.amount);

  /* show the latest month that has a payment: it moves on only once something is paid in a newer month */
  const pi = paidInfo();
  $('#hPaidL').textContent = pi ? pi.label : 'Paid so far';
  $('#hPaid').textContent = pi ? mf(pi.total) : '\u2014';
  const limTotal = S.cards.reduce((s, c) => s + (+c.limit || 0), 0);
  $('#hLimit').textContent = '$' + limTotal.toLocaleString('en-US');

  /* small versions */
  $('#sExp').textContent = mf(tot);
  $('#sMaa').textContent = mf(S.maaser.amount);
  const ni = nextUpInfo();
  $('#sNextL').textContent = ni ? 'Next up \u00b7 ' + weekdayDate(ni.due) : 'Next up';
  $('#sNext').textContent = ni ? (ni.days === 0 ? 'Today' : plural(ni.days, 'day')) : '\u2014';
  $('#sNext').className = ni ? 'amb' : '';

  /* large Paid card: split by card */
  $('#hPaidLB').textContent = pi ? pi.label : 'Paid so far';
  if (!pi) {
    $('#hPaidBV').innerHTML = '<b>\u2014</b>';
    $('#hPaidBar').innerHTML = '';
    $('#hPaidBrk').innerHTML = '<div class="n-none">No payments yet. Add one in the Payments tab.</div>';
  } else {
    $('#hPaidBV').innerHTML = '<i>$</i><b>' + nf(pi.total) + '</b>';
    $('#hPaidBar').innerHTML = splitBar(pi.rows, pi.total);
    $('#hPaidBrk').innerHTML = splitRows(pi.rows, pi.total, mf);
  }

  /* large Credit limit card: split by card */
  const lrows = S.cards.filter(c => +c.limit > 0).map(c => ({ name: lbl(c), color: cCol(c.id), val: +c.limit }));
  $('#hLimBV').innerHTML = '<i>$</i><b>' + limTotal.toLocaleString('en-US') + '</b>';
  $('#hLimBar').innerHTML = lrows.length ? splitBar(lrows, limTotal) : '';
  $('#hLimBrk').innerHTML = lrows.length ? splitRows(lrows, limTotal, v => '$' + v.toLocaleString('en-US')) : '<div class="n-none">Add a credit limit to a card to see it here.</div>';

  homeLayout();
}

/* the latest month that has a payment, with the amount split by card */
function paidInfo() {
  const pays = live();
  if (!pays.length) return null;
  const k = pays.map(p => p.date.slice(0, 7)).sort().pop();
  const [y, m] = pk(k);
  const mp = pays.filter(p => inM(p, k));
  const label = 'Paid in ' + new Date(y, m - 1, 1).toLocaleDateString('en-US', y === new Date().getFullYear() ? { month: 'long' } : { month: 'long', year: 'numeric' });
  const rows = S.cards.map(c => ({ name: lbl(c), color: cCol(c.id), val: sum(mp.filter(p => p.card === c.id)) })).filter(r => r.val > 0).sort((a, b) => b.val - a.val);
  return { label, total: sum(mp), rows };
}
/* whole percent, but never a misleading 100% or 0%: 99.6% and <1% */
const pctText = p => p >= 100 ? '100%' : p > 99 ? Math.min(99.9, Math.round(p * 10) / 10) + '%' : p < 1 ? '<1%' : Math.round(p) + '%';
const cardColor = c => esc(c || '#1b3a6e');
const splitBar = (rows, total) => rows.map(r => `<i style="width:${(r.val / total * 100).toFixed(2)}%;background:${cardColor(r.color)}"></i>`).join('');
const splitRows = (rows, total, fmt) => rows.map(r => `<div class="r"><i style="background:${cardColor(r.color)}"></i><span>${esc(r.name)}</span><em>${pctText(r.val / total * 100)}</em><b>${esc(fmt(r.val))}</b></div>`).join('');

/* put each card where the person wants it: the first two large, the rest small */
function homeLayout() {
  const order = S.home.order, nSmall = order.length - 2;
  order.forEach((k, i) => {
    $$('#hList [data-k="' + k + '"]').forEach(el => {
      const large = el.classList.contains('hl');
      el.hidden = large ? i >= 2 : i < 2;
      el.style.order = i;
      el.classList.toggle('wide', !large && i === order.length - 1 && nSmall % 2 === 1);
    });
  });
}

/* ---------- edit mode: reorder the cards ---------- */
const HOME_NAMES = { exp: 'Total monthly expenses', next: 'Next up', maa: 'Maaser', paid: 'Paid this month', lim: 'Total credit limit' };
const edRows = () => $$('#edList .ed-row');
function edDecorate() {
  const rows = edRows();
  rows.forEach((r, i) => {
    r.querySelector('.n').textContent = i + 1;
    const t = r.querySelector('.tag'); t.textContent = i < 2 ? 'Large' : 'Small'; t.classList.toggle('s', i >= 2);
  });
  const dv = $('#edList .ed-div');
  if (dv) $('#edList').insertBefore(dv, rows[2] || null);
}
function enterHomeEdit() {
  const l = $('#edList');
  l.innerHTML = S.home.order.map(k => `<div class="ed-row" data-k="${k}"><span class="n"></span><span class="nm">${esc(HOME_NAMES[k])}</span><span class="tag"></span><button class="hd" type="button" aria-label="Reorder ${esc(HOME_NAMES[k])}. Use the up and down arrow keys to move it.">${svg(IC.grip, 22)}</button></div>`).join('')
    + '<div class="ed-div">Small cards below</div>';
  edDecorate();
  $('#vHome').classList.add('editing'); $('#hEditor').hidden = false;
  window.scrollTo(0, 0);
}
function exitHomeEdit() {
  if (!$('#vHome').classList.contains('editing')) return;
  $('#vHome').classList.remove('editing'); $('#hEditor').hidden = true;
  renderHome(); window.scrollTo(0, 0);
}
function edSave() {
  const o = edRows().map(r => r.dataset.k);
  if (o.join() === S.home.order.join()) return;
  S.home = { order: o, updatedAt: nowTs() };
  commit('expenses');
}
function bindHomeEdit() {
  $('#hEditBtn').innerHTML = svg(IC.edit, 18);
  $('#hEditBtn').onclick = enterHomeEdit;
  $('#hDone').onclick = exitHomeEdit;
  $('#sMaaBtn').onclick = openMaaser;
  const list = $('#edList'); let d = null;
  const layoutTop = row => list.getBoundingClientRect().top + row.offsetTop;
  list.addEventListener('pointerdown', e => {
    const h = e.target.closest('.hd');
    if (!h || e.button > 0) return;
    const row = h.closest('.ed-row');
    d = { id: e.pointerId, row, startY: e.clientY, startTop: layoutTop(row), ty: 0 };
    row.classList.add('drag');
    try { h.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  list.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    const want = d.startTop + (e.clientY - d.startY);
    const rows = edRows(), others = rows.filter(x => x !== d.row);
    const mid = want + d.row.offsetHeight / 2;
    let idx = 0;
    others.forEach(x => { if (layoutTop(x) + x.offsetHeight / 2 < mid) idx++; });
    if (idx !== rows.indexOf(d.row)) { list.insertBefore(d.row, others[idx] || null); edDecorate(); }
    d.ty = want - layoutTop(d.row);
    d.row.style.transform = 'translateY(' + d.ty.toFixed(1) + 'px) scale(1.03)';
  });
  const end = e => {
    if (!d || e.pointerId !== d.id) return;
    d.row.classList.remove('drag'); d.row.style.transform = '';
    d = null; edSave();
  };
  list.addEventListener('pointerup', end);
  list.addEventListener('pointercancel', end);
  list.addEventListener('keydown', e => {
    const h = e.target.closest('.hd');
    if (!h || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    e.preventDefault();
    const row = h.closest('.ed-row'), rows = edRows(), i = rows.indexOf(row), j = i + (e.key === 'ArrowUp' ? -1 : 1);
    if (j < 0 || j >= rows.length) return;
    list.insertBefore(row, e.key === 'ArrowUp' ? rows[j] : rows[j].nextSibling);
    edDecorate(); edSave(); h.focus();
  });
}

const EXP_COLORS = ['#00c805', '#ff5000', '#ffb700', '#0094ff', '#9d4edd', '#e63946', '#00f5d4', '#ff007f'];
const SUBS_ID = 'subscriptions';
let subsOpen = false;

const activeExp = () => S.expenses.filter(e => !e.isArchived && e.amount > 0).sort((a, b) => b.amount - a.amount || (a.id < b.id ? -1 : 1));
const totalExp = () => round2(activeExp().reduce((s, e) => s + e.amount, 0));
const allExpSorted = () => S.expenses.slice().sort((a, b) => b.amount - a.amount || (a.id < b.id ? -1 : 1));

/* Subscriptions is one built-in expense. updatedAt 0 so real data on another device always wins. */
function ensureSubs() {
  if (S.expenses.some(e => e.id === SUBS_ID)) return;
  S.expenses.push({ id: SUBS_ID, desc: 'Subscriptions', amount: 0, note: null, protected: true, subItems: [], isArchived: false, updatedAt: 0 });
  saveState();
}

function donutHtml(act, total) {
  const r = 60, C = 2 * Math.PI * r;
  let cum = 0, c = `<circle cx="80" cy="80" r="${r}" fill="none" stroke="#172a32" stroke-width="22"/>`;
  act.forEach((e, i) => {
    const len = e.amount / total * C;
    const L = Math.max(len - (act.length > 1 ? 2 : 0), 0.5);
    c += `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${EXP_COLORS[i % EXP_COLORS.length]}" stroke-width="22" stroke-dasharray="${L.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-cum).toFixed(2)}"/>`;
    cum += len;
  });
  return c;
}

function renderExpenses(skipList) {
  const act = activeExp(), total = totalExp();
  $('#eTotal').textContent = nf(total);
  $('#eMaa').textContent = mf(S.maaser.amount);

  const label = act.length ? 'Expense wheel. ' + act.slice(0, 3).map(e => e.desc + ' ' + Math.round(e.amount / total * 100) + ' percent').join(', ') : 'Expense wheel. No expenses yet.';
  $('#eDonut').innerHTML = `<svg viewBox="0 0 160 160" width="128" height="128" role="img" aria-label="${esc(label)}">${act.length ? donutHtml(act, total) : '<circle cx="80" cy="80" r="60" fill="none" stroke="#172a32" stroke-width="22"/>'}</svg>
    <div class="n-dc"><b>${act.length}</b><small>active</small></div>`;
  $('#eLeg').innerHTML = act.length
    ? act.map((e, i) => `<div><i style="background:${EXP_COLORS[i % EXP_COLORS.length]}"></i><span>${esc(e.desc)}</span><em>${Math.round(e.amount / total * 100)}%</em></div>`).join('')
    : '<div><span style="color:var(--mut)">Awaiting expenses</span></div>';

  if (skipList) return;
  renderExpenseList();
}

function renderExpenseList() {
  const all = allExpSorted();
  const colors = {};
  activeExp().forEach((e, i) => { colors[e.id] = EXP_COLORS[i % EXP_COLORS.length]; });
  const visible = all;
  const onlyEmptySubs = all.length === 1 && all[0].id === SUBS_ID && !(all[0].subItems || []).length;
  $('#eEmpty').hidden = !onlyEmptySubs;
  $('#eList').innerHTML = visible.map(e => {
    if (e.id === SUBS_ID) return subsRow(e, colors[e.id] || '#9d4edd');
    const off = e.isArchived ? ' off' : '';
    const badge = e.isArchived ? '<span class="badge">Paused</span>' : '';
    const dot = e.isArchived ? '#6b7280' : (colors[e.id] || '#6b7280');
    return `<button class="xr${off}" type="button" data-id="${esc(e.id)}"><span class="xl"><i class="xd" style="background:${dot}"></i><span class="xt"><b><span class="t">${esc(e.desc)}</span>${badge}</b>${e.note ? `<small>${esc(e.note)}</small>` : ''}</span></span><span class="xa">${mf(e.amount)}</span></button>`;
  }).join('');
}

function subsRow(e, color) {
  const items = (e.subItems || []).slice().sort((a, b) => b.amount - a.amount);
  const sub = items.length === 1 ? '1 subscription' : items.length + ' subscriptions';
  let h = `<button class="xr" type="button" data-id="${SUBS_ID}" aria-expanded="${subsOpen}"><span class="xl"><i class="xd" style="background:${items.length ? color : '#6b7280'}"></i><span class="xt"><b><span class="t">Subscriptions</span></b><small>${sub}</small></span></span><span style="display:flex;align-items:center;gap:8px"><span class="xa">${mf(e.amount)}</span><span class="chev${subsOpen ? ' up' : ''}">${svg(IC.down, 16)}</span></span></button>`;
  if (subsOpen) {
    h += `<div class="xs">${items.length ? items.map(s => `<div class="si"><span>${esc(s.name)}</span><span class="r"><span>${mf(s.amount)}</span><button type="button" class="sub-rm" data-sid="${esc(s.id)}" aria-label="Remove ${esc(s.name)}">${svg(IC.x, 14)}</button></span></div>`).join('') : '<div class="none">No subscriptions yet.</div>'}
      <form class="sub-add"><input class="sn" aria-label="Subscription name" placeholder="Name" required><input class="sa" type="number" step="0.01" min="0.01" inputmode="decimal" aria-label="Amount" placeholder="0.00" required><button type="submit">Add</button></form></div>`;
  }
  return h;
}

const Subs = {
  recompute(e) { e.amount = round2((e.subItems || []).reduce((s, i) => s + i.amount, 0)); e.updatedAt = nowTs(); },
  add(name, amount) {
    const e = S.expenses.find(x => x.id === SUBS_ID); if (!e) return;
    e.subItems = e.subItems || [];
    e.subItems.push({ id: uid(), name, amount: round2(amount) });
    this.recompute(e); commit('expenses');
  },
  remove(sid) {
    const e = S.expenses.find(x => x.id === SUBS_ID); if (!e) return;
    e.subItems = (e.subItems || []).filter(i => i.id !== sid);
    this.recompute(e); commit('expenses');
  }
};

/* ---------- Maaser ---------- */
const Maaser = {
  set(amount) {
    const prev = S.maaser.amount || 0, next = Math.max(0, round2(amount));
    if (next === prev) return false;
    S.maaser.history = (S.maaser.history || []).concat([{ amount: next, delta: round2(next - prev), timestamp: nowTs() }]).slice(-200);
    S.maaser.amount = next; S.maaser.updatedAt = nowTs();
    commit('expenses');
    return true;
  },
  adjust(sign, input) {
    const d = parseFloat(input.value);
    if (isNaN(d) || d <= 0) return false;
    this.set((S.maaser.amount || 0) + sign * d);
    input.value = '';
    return true;
  },
  clearHistory() { S.maaser.history = []; S.maaser.updatedAt = nowTs(); commit('expenses'); }
};

function openMaaser() {
  const hist = (S.maaser.history || []).slice().sort((a, b) => b.timestamp - a.timestamp);
  Sheet.open(`<h2>Maaser</h2>
  <label for="ma">Adjust by</label>
  <div class="mrow2"><input id="ma" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"><button class="n-pm m" id="mm" type="button" aria-label="Subtract">${svg(IC.minus, 20)}</button><button class="n-pm p" id="mp" type="button" aria-label="Add">${svg(IC.plus, 20)}</button></div>
  <form id="mf" style="margin-top:14px;padding-top:14px;border-top:.5px solid var(--line)">
    <label for="mx">Set exact amount ($)</label>
    <input id="mx" type="number" step="0.01" min="0" inputmode="decimal" required value="${S.maaser.amount}" style="font-family:ui-monospace,Menlo,monospace">
    <button class="btn" type="submit">Save amount</button>
  </form>
  <div class="mhead"><h4>Change history</h4>${hist.length ? '<button id="mclr" type="button">Clear</button>' : ''}</div>
  <div>${hist.length ? hist.map(h => `<div class="mhist"><span class="${h.delta >= 0 ? 'pos' : 'neg'}">${h.delta >= 0 ? '+' : '-'}${mf(Math.abs(h.delta))}</span><span>${mf(h.amount)}</span><small>${esc(short(new Date(h.timestamp)))}</small></div>`).join('') : '<div class="mhist"><small>No changes recorded yet.</small></div>'}</div>
  <button class="btn s" id="mcl" type="button" style="margin-top:14px">Close</button>`, () => {
    $('#mcl').onclick = closeSheet;
    $('#mm').onclick = () => { if (Maaser.adjust(-1, $('#ma'))) openMaaser(); };
    $('#mp').onclick = () => { if (Maaser.adjust(1, $('#ma'))) openMaaser(); };
    $('#mf').onsubmit = ev => { ev.preventDefault(); const v = parseFloat($('#mx').value); if (!isNaN(v) && v >= 0) { Maaser.set(v); openMaaser(); } };
    if ($('#mclr')) $('#mclr').onclick = async () => { if (await confirmDlg('Clear your Maaser history?', 'Clear')) { Maaser.clearHistory(); openMaaser(); } };
  });
}

/* ---------- events for the Expenses list ---------- */
function bindExpenses() {
  $('#eList').addEventListener('click', ev => {
    const rm = ev.target.closest('.sub-rm');

/* =====================================================================
   Cards tab (ported from CardWise behavior)
   ===================================================================== */
const SOON = 3, PASS = '1203';
const lbl = c => c.name || (c.last4 ? 'Card ending ' + c.last4 : 'Unnamed card');

function shrink(file) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => {
      const w = Math.min(720, im.width), h = im.height * w / im.width, c = document.createElement('canvas');
      c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
      res(c.toDataURL('image/jpeg', .75)); URL.revokeObjectURL(im.src);
    };
    im.src = URL.createObjectURL(file);
  });
}

function cardEl(c, big) {
  const el = document.createElement('div');
  el.className = 'card' + (c.photo ? ' ph' : ' gen') + (big ? ' big' : '');
  el.dataset.id = c.id;
  if (c.photo) el.style.color = '#fff';
  const nm = c.photo ? '' : `<span class="nm">${esc(c.name)}</span>`;
  const bt = c.last4 && !c.photo ? `<div class="bt"><div class="chip"></div><div class="num">•••• •••• •••• ${esc(c.last4)}</div></div>` : '';
  if (c.photo && big) el.innerHTML = `<img src="${c.photo}" alt="">`;
  else { if (c.photo) el.style.background = `center/cover url(${c.photo})`; el.innerHTML = nm + bt; }
  return el;
}

/* reminders: statements closing and payments due in the next few days */
function cardSummary() {
  const g = {};
  S.cards.forEach(c => [['s', c.stmtDay], ['d', c.dueDay]].forEach(([t, day]) => {
    if (!+day) return;
    const d = nxt(+day), n = daysUntil(d);
    if (n <= SOON) (g[t + d.getTime()] = g[t + d.getTime()] || { t, d, n, names: [] }).names.push(lbl(c));
  }));
  $('#cSum').innerHTML = Object.values(g).sort((a, b) => a.n - b.n).map(x => {
    const w = x.n === 0 ? 'today' : x.n === 1 ? 'tomorrow' : 'in ' + x.n + ' days', m = x.names.length > 1;
    const h = x.t === 's' ? (m ? 'Statements close ' : 'Statement closes ') + w : (m ? 'Payments due ' : 'Payment due ') + w;
    return `<div class="sr"><div class="ic" style="color:${x.t === 's' ? '#0094ff' : '#ffb700'}">${svg(IC[x.t === 's' ? 'stmt' : 'due'])}</div><div><b>${h}</b><small>${esc(x.names.join(', '))} on ${esc(short(x.d))}</small></div></div>`;
  }).join('');
}

function renderCards() {
  cardSummary();
  $('#cTotal').textContent = S.cards.reduce((s, c) => s + (+c.limit || 0), 0).toLocaleString('en-US');
  $('#cCount').textContent = S.cards.length === 1 ? '1 card' : S.cards.length + ' cards';
  const st = $('#cStack'); st.innerHTML = '';
  if (!S.cards.length) { st.innerHTML = '<div class="empty">Tap + to add your first card.</div>'; return; }
  S.cards.forEach(c => st.appendChild(cardEl(c)));

/* ---------- press, drag to reorder, tap to open ---------- */
let P = null;
const STEP = 50;
function bindCardStack() {
  const st = $('#cStack');
  st.addEventListener('pointerdown', e => {
    const el = e.target.closest('.card'); if (!el) return;
    P = { el, x: e.clientX, y: e.clientY, drag: false, start: Array.from(st.children).indexOf(el) }; P.idx = P.start;
    P.t = setTimeout(() => {
      if (!P) return; P.drag = true; el.classList.add('lift'); navigator.vibrate && navigator.vibrate(10);
      try { el.setPointerCapture(e.pointerId); } catch (_) {}

  });
  addEventListener('pointermove', e => {
    if (!P) return;
    const dx = e.clientX - P.x, dy = e.clientY - P.y;
    if (!P.drag) { if (Math.abs(dx) > 8 || Math.abs(dy) > 8) { clearTimeout(P.t); P = null; } return; }
    const kids = Array.from(st.children), n = kids.length, tgt = Math.max(0, Math.min(n - 1, P.start + Math.round(dy / STEP)));
    if (tgt !== P.idx) { const others = kids.filter(k => k !== P.el); st.insertBefore(P.el, others[tgt] || null); P.idx = tgt; }
    P.el.style.transform = `translateY(${dy - (P.idx - P.start) * STEP}px)`;
  });
  addEventListener('touchmove', e => { if (P && P.drag) e.preventDefault(); }, { passive: false });
  const endPress = e => {
    if (!P) return;
    clearTimeout(P.t);
    const p = P; P = null;
    if (p.drag) {
      p.el.classList.remove('lift'); p.el.style.transform = '';
      if (e.type === 'pointerup') {
        const ids = Array.from(st.children).map(k => k.dataset.id);
        let changed = false;
        ids.forEach((id, i) => { const c = S.cards.find(x => x.id === id); if (c && c.pos !== i) { c.pos = i; c.updatedAt = nowTs(); changed = true; } });
        sortCards();
        if (changed) commit('cards'); else renderCards();
      } else renderCards();
    } else if (e.type === 'pointerup') openDetail(p.el.dataset.id);
  };
  addEventListener('pointerup', endPress);
  addEventListener('pointercancel', endPress);
  addEventListener('contextmenu', e => { if (e.target.closest('.card')) e.preventDefault(); });
}

/* ---------- chart color picker (shade square + hue slider) ---------- */
function hexToHsv(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), d = mx - Math.min(r, g, b);
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: h * 60, s: mx ? d / mx : 0, v: mx };
}
function hsvToHex(h, s, v) {
  const f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return '#' + [f(5), f(3), f(1)].map(x => Math.round(x * 255).toString(16).padStart(2, '0')).join('');
}
function openColorPicker(id) {
  const c = S.cards.find(x => x.id === id); if (!c) return;
  const st = hexToHsv(cCol(id));
  Sheet.open(`<h2>Chart color</h2><p>${esc(lbl(c))}. This color is used for this card in every bar and chart.</p>
  <div class="cpk-sv" id="cpsv"><i id="cpsh"></i></div>
  <div class="cpk-hue" id="cphu" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><i id="cphh"></i></div>
  <div class="cpk-row"><div class="cpk-sw" id="cpsw"></div><input class="cpk-hex" id="cphx" maxlength="7" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Hex color"></div>
  <div class="cpk-prev"><small>Preview</small><div class="n-bar" id="cppv" style="gap:2px"></div></div>
  <div class="cpk-btns"><button class="btn s" id="cpr" type="button">Reset to automatic</button><button class="btn" id="cps" type="button">Save</button></div>`, b => {
    const sv = $('#cpsv'), hu = $('#cphu'), W = [44, 26, 15, 10, 5, 4, 3, 2];
    const draw = (fromHex) => {
      const hex = hsvToHex(st.h, st.s, st.v);
      sv.style.background = `linear-gradient(to top,#000,rgba(0,0,0,0)),linear-gradient(to right,#fff,hsl(${st.h.toFixed(0)} 100% 50%))`;
      const sh = $('#cpsh'); sh.style.left = (st.s * 100).toFixed(1) + '%'; sh.style.top = ((1 - st.v) * 100).toFixed(1) + '%'; sh.style.background = hex;
      const hh = $('#cphh'); hh.style.left = (st.h / 360 * 100).toFixed(1) + '%'; hh.style.background = `hsl(${st.h.toFixed(0)} 100% 50%)`;
      hu.setAttribute('aria-valuenow', Math.round(st.h));
      $('#cpsw').style.background = hex;
      if (!fromHex) $('#cphx').value = hex.toUpperCase();
      const list = S.cards.slice(0, W.length);
      const tot = list.reduce((t, x, i) => t + W[i], 0);
      $('#cppv').innerHTML = list.map((x, i) => `<i style="width:${(W[i] / tot * 100).toFixed(1)}%;background:${x.id === id ? hex : esc(cCol(x.id))}${x.id === id ? ';outline:2px solid #fff;outline-offset:1px' : ''}"></i>`).join('');
      return hex;
    };
    const drag = (el, fn) => {
      el.addEventListener('pointerdown', e => { el.setPointerCapture(e.pointerId); fn(e); e.preventDefault(); });
      el.addEventListener('pointermove', e => { if (el.hasPointerCapture(e.pointerId)) fn(e); });
    };
    drag(sv, e => { const r = sv.getBoundingClientRect(); st.s = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); st.v = 1 - Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)); draw(); });
    drag(hu, e => { const r = hu.getBoundingClientRect(); st.h = Math.max(0, Math.min(359.99, (e.clientX - r.left) / r.width * 360)); draw(); });
    $('#cphx').addEventListener('input', e => {
      let v = e.target.value.trim(); if (v[0] !== '#') v = '#' + v;
      if (/^#[0-9a-f]{6}$/i.test(v)) { Object.assign(st, hexToHsv(v.toLowerCase())); draw(true); }
    });
    draw();
    $('#cps').onclick = () => { c.chartColor = hsvToHex(st.h, st.s, st.v); c.updatedAt = nowTs(); closeSheet(); commit('cards'); };
    $('#cpr').onclick = () => { c.chartColor = ''; c.updatedAt = nowTs(); closeSheet(); commit('cards'); };
  });
}

/* =====================================================================
   Payments tab (ported from CardWise behavior): a log of dated payments
   ===================================================================== */
const mk = (y, m) => y + '-' + String(m + 1).padStart(2, '0');
const pk = k => k.split('-').map(Number);
const mLong = (y, m) => new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
const mAbbr = m => new Date(2000, m, 1).toLocaleDateString('en-US', { month: 'short' });
const dShort = s => pd(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const dFull = s => pd(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const CUR = { get y() { return new Date().getFullYear(); }, get m() { return new Date().getMonth(); } };
const CKf = () => mk(CUR.y, CUR.m);
let curPay = null, selA = CKf(), selC = {};
const PAL = ['#2f6fe0', '#9d4edd', '#2fb457', '#d9d9d6', '#ffb700', '#ff5000', '#0094ff', '#e056a0'];

const live = () => S.payments.filter(p => S.cards.some(c => c.id === p.card));
const inM = (p, k) => p.date.slice(0, 7) === k;
const sum = a => a.reduce((t, p) => t + (+p.amt || 0), 0);
const byDate = (a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (a.id < b.id ? 1 : -1);
const cCol = id => { const c = S.cards.find(x => x.id === id); return (c && c.chartColor) || PAL[Math.max(0, S.cards.findIndex(x => x.id === id)) % PAL.length]; };

/* every month from the first payment up to now (at least 6 so the chart never looks empty) */
function allKeys(list) {
  const e = list.map(p => p.date.slice(0, 7)).sort()[0]; let n = 6;
  if (e) { const [ey, em] = pk(e); n = Math.max(6, (CUR.y - ey) * 12 + CUR.m - (em - 1) + 1); }
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const d = new Date(CUR.y, CUR.m - i, 1); out.push(mk(d.getFullYear(), d.getMonth())); }
  return out;
}

/* sideways-scrolling bar chart; segF(monthKey) -> [{c:color,v:amount}] stacked bottom to top */
function drawChart(host, keys, segF, sel) {
  const old = host.querySelector('.sc'), left = old && old.scrollWidth > 0 ? old.scrollLeft : null;
  const vals = keys.map(segF), tots = vals.map(a => a.reduce((t, x) => t + x.v, 0)), mx = Math.max(1, ...tots);
  const cols = vals.map((segs, i) => {
    const on = segs.filter(x => x.v > 0);
    return `<div class="col${keys[i] === sel ? ' sel' : ''}" data-k="${keys[i]}">${on.map((x, j) => `<div style="height:${Math.max(1.5, x.v / mx * 130)}px;background:${x.c}${j === on.length - 1 ? ';border-radius:3px 3px 0 0' : ''}"></div>`).join('')}</div>`;
  }).join('');
  const labs = keys.map((k, i) => { const [yr, mo] = pk(k); return `<span class="${k === sel ? 'on' : ''}">${mAbbr(mo - 1) + (mo === 1 || i === 0 ? ' ’' + String(yr).slice(2) : '')}</span>`; }).join('');
  host.innerHTML = `<div class="sc"><div class="cols">${cols}</div><div class="labs">${labs}</div></div>`;
  const n = host.querySelector('.sc'); n.scrollLeft = left == null ? n.scrollWidth : left;
}
function centerSel(host) {
  const n = host.querySelector('.sc'), c = host.querySelector('.col.sel'); if (!n || !c) return;
  const x = c.getBoundingClientRect().left - n.getBoundingClientRect().left + n.scrollLeft - n.clientWidth / 2 + 26;
  n.scrollTo({ left: Math.max(0, x), behavior: 'smooth' });
}

/* calendar: every month from the first payment to now */
function openMonthPicker(list, sel, onPick) {
  const keys = allKeys(list), tot = {}; list.forEach(p => { const k = p.date.slice(0, 7); tot[k] = (tot[k] || 0) + (+p.amt || 0); });
  const y0 = pk(keys[0])[0]; let h = '<h2>Jump to a month</h2>';
  for (let y = CUR.y; y >= y0; y--) {
    h += `<div class="yl">${y}</div><div class="mg">`;
    for (let m = 0; m < 12; m++) {
      const k = mk(y, m);
      h += keys.includes(k) ? `<button class="mc${k === sel ? ' on' : ''}" data-k="${k}"><b>${mAbbr(m)}</b><small>${tot[k] ? '$' + Math.round(tot[k]).toLocaleString('en-US') : '—'}</small></button>` : '<span class="mc off"></span>';
    }
    h += '</div>';
  }
  h += '<button class="btn s" id="mcx" type="button">Close</button>';
  Sheet.open(h, b => {
    b.querySelectorAll('button.mc').forEach(x => x.onclick = () => { closeSheet(); onPick(x.dataset.k); });
    $('#mcx').onclick = closeSheet;
  });
}

function refreshPay() {

  if (curPay && $('#pdetail').classList.contains('on')) openPayDetail(curPay);
}

const keysSel = id => selC[id] || CKf();
function drawCardChart(id) {
  const all = live().filter(p => p.card === id), keys = allKeys(all), sel = keys.includes(selC[id]) ? selC[id] : CKf();
  drawChart($('#pchart2'), keys, kk => [{ c: cCol(id), v: sum(all.filter(p => inM(p, kk))) }], sel);
  const a = all.filter(p => inM(p, sel)).sort(byDate), [y, m] = pk(sel);
  $('#cm1').textContent = mLong(y, m - 1); $('#cm2').textContent = mf(sum(a));
  $('#cm3').textContent = sel === CKf() ? 'Paid this month' : 'Paid that month';
  $('#cm4').textContent = a.length ? 'Last paid ' + dShort(a[0].date) : (sel === CKf() ? 'No payments this month' : 'No payments that month');
}
function openPayDetail(id) {
  const c = S.cards.find(x => x.id === id);
  if (!c) { closePayDetail(); return; }
  curPay = id;
  const all = live().filter(p => p.card === id).sort(byDate);
  const thumb = c.photo ? `<img class="thb" src="${c.photo}" alt="">` : `<div class="thb gen-bg" style="aspect-ratio:1.586"></div>`;
  $('#pdbody').innerHTML = `<div class="nav"><button class="lk" id="pdb">${svg(IC.back)}Payments</button><div class="ttl">${esc(lbl(c))}</div><div style="width:76px"></div></div>
  <div class="ptop">${thumb}<div><div class="pm1" id="cm1"></div><div class="pm2" id="cm2"></div><div class="pm3" id="cm3"></div><div class="pm4" id="cm4"></div></div></div>
  <div class="hh"><span class="sec">History</span><button class="ib" id="pcal2" aria-label="Pick a month">${svg(IC.cal, 16)}</button></div>
  <div class="cw" id="pchart2"></div>
  <div class="sec" style="margin-top:6px">Payments</div>
  <div>${all.length ? all.slice(0, 60).map(p => `<div class="mr" data-id="${esc(p.id)}" role="button" tabindex="0"><div class="pl"><b>${mf(p.amt)}</b><small>${dFull(p.date)}</small></div>${svg(IC.right, 16)}</div>`).join('') : '<div class="empty" style="padding:16px 0">No payments yet. Tap + to add one.</div>'}</div>`;
  $('#pdb').onclick = closePayDetail;
  $('#pcal2').onclick = () => openMonthPicker(all, keysSel(id), k => { selC[id] = k; drawCardChart(id); centerSel($('#pchart2')); });
  $('#pdbody').querySelectorAll('.mr').forEach(r => r.onclick = () => openPayForm(S.payments.find(p => p.id === r.dataset.id)));
  $('#pchart2').onclick = e => { const col = e.target.closest('.col'); if (col) { selC[id] = col.dataset.k; drawCardChart(id); } };
  drawCardChart(id); $('#pdetail').classList.add('on');
}
function closePayDetail() { curPay = null; $('#pdetail').classList.remove('on'); }

function openPayForm(p, presel) {
  if (!S.cards.length) return;
  const e = p || { card: presel || curPay || S.cards[0].id, amt: '', date: tstr() };
  Sheet.open(`<h2>${p ? 'Edit payment' : 'Add payment'}</h2>
  <label for="pc">Card</label><select id="pc">${S.cards.map(c => `<option value="${esc(c.id)}"${c.id === e.card ? ' selected' : ''}>${esc(lbl(c))}</option>`).join('')}</select>
  <label for="pa">Amount paid ($)</label><input id="pa" type="number" inputmode="decimal" step="0.01" value="${e.amt}" placeholder="0.00">
  <label for="pdt">Date paid</label><div class="drow" id="dr"><span>${e.date === tstr() ? 'Today, ' + dShort(e.date) : dFull(e.date)}</span><button type="button" class="lk" id="dc">Change</button></div><input id="pdt" type="date" value="${e.date}" max="${tstr()}" style="display:none">
  <button class="btn" id="psv" type="button">Save payment</button><button class="btn s" id="pcn" type="button">Cancel</button>${p ? '<button class="btn d" id="pdl" type="button">Delete payment</button>' : ''}`, () => {
    $('#dc').onclick = () => { $('#dr').style.display = 'none'; $('#pdt').style.display = 'block'; $('#pdt').focus(); };
    $('#pcn').onclick = closeSheet;
    $('#psv').onclick = () => {
      const a = +$('#pa').value, d = $('#pdt').value || e.date;
      if (!(a > 0)) { $('#pa').focus(); return; }
      const o = { id: e.id || 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), card: $('#pc').value, amt: Math.round(a * 100) / 100, date: d > tstr() ? tstr() : d, updatedAt: nowTs() };
      const i = p ? S.payments.findIndex(x => x.id === p.id) : -1;
      if (i >= 0) S.payments[i] = o; else S.payments.push(o);
      const k = o.date.slice(0, 7); selA = k; selC[o.card] = k;
      closeSheet(); commit('payments');
    };
    if (p) $('#pdl').onclick = async () => {
      if (await confirmDlg('Delete this payment?')) { closeSheet(); removeItem('payments', p.id); }
    };
  });
}

function bindPayments() {
  $('#pchart').onclick = e => { const col = e.target.closest('.col'); if (col) { selA = col.dataset.k; refreshPay(); } };
  $('#plist').onclick = e => { const r = e.target.closest('.pr'); if (r) { selC[r.dataset.id] = selA; openPayDetail(r.dataset.id); } };
  $('#plist').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { const r = e.target.closest('.pr'); if (r) { e.preventDefault(); r.click(); } } };
  $('#pcal').innerHTML = svg(IC.cal, 16);
  $('#pcal').onclick = () => openMonthPicker(live(), selA, k => { selA = k; refreshPay(); centerSel($('#pchart')); });
  $('#pback').onclick = () => { selA = CKf(); refreshPay(); };
}

/* =====================================================================
   Main: tabs, floating button, rendering, startup
   ===================================================================== */
const TABS = [
  { t: 'home', v: '#vHome', label: 'Home', icon: IC.home },
  { t: 'exp', v: '#vExp', label: 'Expenses', icon: IC.pie },
  { t: 'cards', v: '#vCards', label: 'Cards', icon: IC.tcard },
  { t: 'pay', v: '#vPay', label: 'Payments', icon: IC.cash }
];
let curTab = 'home';

/* the dark capsule, the glass lens and the pill glide smoothly */
const Glide = { cx: 0, lx: 0, m: 0, ready: false, until: 0, raf: 0, last: 0, lift: false, fx: null };
function glideKick(snap) {
  if (snap) Glide.ready = false;
  Glide.until = performance.now() + 520;
  if (!Glide.raf) { Glide.last = performance.now(); Glide.raf = requestAnimationFrame(glideFrame); }
}
function glideFrame(now) {
  Glide.raf = 0;
  const bar = $('#tabsIn'); if (!bar) return;
  const row = bar.querySelector('.tbr'), cap = bar.querySelector('.tbi'), ln = bar.querySelector('.tbl');
  const btn = row && row.querySelector('.tb.on'); if (!btn || !ln) return;
  const lc = ln.firstElementChild;
  const dt = Math.min(50, now - Glide.last); Glide.last = now;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches, first = !Glide.ready, snap = calm || first;
  const kS = snap ? 1 : 1 - Math.exp(-dt / 48);
  const kF = snap ? 1 : 1 - Math.exp(-dt / (Glide.lift && Glide.fx != null ? 26 : 48));
  const rowL = row.offsetLeft, rowTop = row.offsetTop, rowH = row.offsetHeight, rowW = row.offsetWidth;
  const iw = btn.offsetWidth, bc = rowL + btn.offsetLeft + iw / 2;
  const restW = iw + 10, liftW = iw * 1.38;
  Glide.m += ((Glide.lift ? 1 : 0) - Glide.m) * (snap ? 1 : 1 - Math.exp(-dt / 55));
  const lw = restW + (liftW - restW) * Glide.m;
  let tl = bc;
  if (Glide.lift && Glide.fx != null) tl = Math.max(rowL + lw / 2, Math.min(rowL + rowW - lw / 2, Glide.fx));
  if (first) { Glide.cx = bc; Glide.lx = bc; Glide.ready = true; }
  else { Glide.cx += (bc - Glide.cx) * kS; Glide.lx += (tl - Glide.lx) * kF; }
  /* resting capsule */
  cap.style.width = restW.toFixed(1) + 'px'; cap.style.height = (rowH - 8) + 'px'; cap.style.top = (rowTop + 4) + 'px';
  cap.style.transform = 'translateX(' + (Glide.cx - restW / 2).toFixed(2) + 'px)';
  cap.style.opacity = (1 - Glide.m).toFixed(3);
  /* glass lens with the magnified copy of the icons */
  const ll = Glide.lx - lw / 2, lh = rowH - 8 + 18 * Glide.m, lt = rowTop + 4 - 9 * Glide.m;
  ln.style.width = lw.toFixed(1) + 'px'; ln.style.height = lh.toFixed(1) + 'px'; ln.style.top = lt.toFixed(1) + 'px';
  ln.style.transform = 'translateX(' + ll.toFixed(2) + 'px)'; ln.style.opacity = Math.min(1, Glide.m * 1.4).toFixed(3);
  lc.style.width = rowW + 'px'; lc.style.height = rowH + 'px'; lc.style.top = (rowTop - lt).toFixed(1) + 'px';
  lc.style.transformOrigin = (Glide.lx - rowL).toFixed(2) + 'px 50%';
  lc.style.transform = 'translateX(' + (rowL - ll).toFixed(2) + 'px) scale(' + (1 + 0.18 * Glide.m).toFixed(3) + ')';
  /* hide the real icons under the lens (the magnified copy shows instead) */
  row.style.setProperty('--hl', (ll - rowL).toFixed(1) + 'px');
  row.style.setProperty('--hr', (ll + lw - rowL).toFixed(1) + 'px');
  row.style.setProperty('--ha', Glide.m.toFixed(3));
  const busy = Math.abs(bc - Glide.cx) > .3 || Math.abs(tl - Glide.lx) > .3 || Math.abs((Glide.lift ? 1 : 0) - Glide.m) > .003 || Glide.lift;
  if (busy || now < Glide.until) Glide.raf = requestAnimationFrame(glideFrame);
}

function setTab(t) {
  curTab = t;
  TABS.forEach(x => { $(x.v).hidden = x.t !== t; });
  $$('.tb').forEach(b => { b.classList.toggle('on', b.dataset.t === t); if (b.dataset.t === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  closePayDetail();
  if (t !== 'home') exitHomeEdit();
  $('#fab').hidden = t === 'home';
  $('#fab').setAttribute('aria-label', t === 'exp' ? 'Add expense' : t === 'cards' ? 'Add card' : 'Add payment');
  LS.set('et_tab', t);
  window.scrollTo(0, 0);
  $$('.lci').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#tabs').classList.toggle('home', t === 'home');
  glideKick();
  /* the bar starts moving first; only the screen being opened is redrawn (the others are kept current by every edit) */
  if (t === 'home') renderHome(); else if (t === 'exp') renderExpenses(); else if (t === 'cards') { if (!(P && P.drag)) renderCards(); } else refreshPay();
}

function renderAll(fromSync) {
  /* do not disturb a form the person is typing in, or a card being dragged */
  const typing = document.activeElement && $('#eList').contains(document.activeElement);
  renderHome();
  renderExpenses(!!fromSync && typing);
  if (!(P && P.drag)) renderCards();
  refreshPay();
  refreshOpenDetail();
}
hooks.render = renderAll;

/* press the bar: a glass lens lifts under your finger; slide to switch tabs */
function bindTabSwipe() {
  const bar = $('#tabsIn'); let st = null, swallow = false;
  const local = e => { const r = bar.getBoundingClientRect(); return (e.clientX - r.left) * (bar.offsetWidth / r.width); };
  const idx = x => { const row = bar.querySelector('.tbr'); return Math.max(0, Math.min(TABS.length - 1, Math.floor((x - row.offsetLeft) / (row.offsetWidth / TABS.length)))); };
  const lift = () => { Glide.lift = true; bar.classList.add('lift'); glideKick(); };
  bar.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    st = { id: e.pointerId, x: e.clientX, drag: false, timer: 0 };
    Glide.fx = local(e);
    /* a quick tap just moves the capsule; the lens lifts after a short hold or as soon as the finger slides */
    st.timer = setTimeout(() => { if (st) lift(); }, 120);
  });
  bar.addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.id) return;
    Glide.fx = local(e);
    if (!st.drag) {
      if (Math.abs(e.clientX - st.x) < 8) { if (Glide.lift) glideKick(); return; }
      st.drag = true; lift();
      try { bar.setPointerCapture(e.pointerId); } catch (_) {}
    }
    const t = TABS[idx(Glide.fx)].t;
    if (t !== curTab) { setTab(t); if (navigator.vibrate) navigator.vibrate(6); }
    glideKick();
  });
  const end = e => {
    if (!st || e.pointerId !== st.id) return;
    if (st.drag) { swallow = true; setTimeout(() => { swallow = false; }, 60); }
    clearTimeout(st.timer);
    st = null; Glide.lift = false; Glide.fx = null; bar.classList.remove('lift'); glideKick();
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
  bar.addEventListener('click', e => { if (swallow) { e.stopPropagation(); e.preventDefault(); } }, true);
}

function bindGlobal() {
  /* tab bar */
  $('#tabsIn').innerHTML = '<i class="tbi" aria-hidden="true"></i><div class="tbr">'
    + TABS.map(x => `<button class="tb" type="button" data-t="${x.t}" aria-label="${x.label}">${svg(x.icon, 24)}<span>${x.label}</span></button>`).join('')
    + '</div><div class="tbl" aria-hidden="true"><div class="lc">'
    + TABS.map(x => `<div class="lci" data-t="${x.t}">${svg(x.icon, 24)}<span>${x.label}</span></div>`).join('')
    + '</div></div>';
  $$('.tb').forEach(b => { b.onclick = () => setTab(b.dataset.t); });
  bindTabSwipe();

  /* shortcuts that jump to a tab */
  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if (go) setTab(go.dataset.go);
    if (e.target.closest('.sync-open')) openSetup(false);
  });

  /* floating add button follows the current tab */
  $('#fab').innerHTML = svg(IC.plus, 26).replace('stroke-width="2"', 'stroke-width="2.5"');
  $('#fab').onclick = () => {
    if (curTab === 'exp') openExpenseForm();
    else if (curTab === 'cards') openCardForm();
    else if (curTab === 'pay') {
      if (!S.cards.length) { openCardForm(); return; }
      openPayForm(null, curPay);
    }
  };

  /* Home: chevron icon, Maaser controls */
  $$('.chev').forEach(x => { x.innerHTML = svg(IC.right, 16); });
  bindHomeEdit();
  $('#hSub').innerHTML = svg(IC.minus, 20);
  $('#hAdd').innerHTML = svg(IC.plus, 20);
  $('#hSub').onclick = () => Maaser.adjust(-1, $('#hAdj'));
  $('#hAdd').onclick = () => Maaser.adjust(1, $('#hAdj'));
  $('#hAdj').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); Maaser.adjust(1, $('#hAdj')); } });
  $('#hMaaBtn').onclick = openMaaser;

  bindExpenses();
  bindCardStack();
  bindPayments();

  /* dismiss sheets by tapping the dim area, or Escape */
  $('#sheet').addEventListener('pointerdown', e => { if (e.target.id === 'sheet') closeSheet(); });
  $('#pin').addEventListener('pointerdown', e => { if (e.target.id === 'pin') $('#pin').classList.remove('on'); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('#cf').classList.contains('on')) $('#cfc').click();
    else if ($('#pin').classList.contains('on')) $('#pin').classList.remove('on');
    else if (Sheet.isOpen()) closeSheet();
  });

  /* another tab of this app changed the data */
  addEventListener('storage', e => { if (e.key === KEY) { loadState(); renderAll(true); } });
  /* sync when the app comes back to the front or the network returns */
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.connected()) Sync.run(); });
  addEventListener('online', () => { if (Sync.connected()) Sync.run(); });
  setInterval(() => { if (document.visibilityState === 'visible' && Sync.connected()) Sync.run(); }, 20000);
  /* a day may pass while the app stays open */
  setInterval(() => { if (document.visibilityState === 'visible') renderHome(); }, 60000);
}

function init() {
  loadState();
  ensureSubs();
  bindGlobal();
  const t = LS.get('et_tab');
  setTab(TABS.some(x => x.t === t) ? t : 'home');
  glideKick(true);
  addEventListener('resize', () => glideKick(true));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => glideKick(true));
  if (Sync.connected()) { Sync.status('Syncing', 'w'); Sync.run(); }
  else {
    Sync.status('Not connected', 'e');
    if (!LS.get('et_seen')) { LS.set('et_seen', '1'); openSetup(true); }
  }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}
init();


})();
</script>
