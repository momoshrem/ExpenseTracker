<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
    .container { max-width: 800px; margin: 0 auto; }
    
    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .header-actions { display: flex; gap: 10px; align-items: center; }

    /* Buttons & Badges */
    .btn { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; font-size: 0.875rem; transition: background 0.2s; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover { background: #fecaca; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; }
    .badge-paused { background: #e2e8f0; color: #64748b; }
    .badge-count { background: var(--primary); color: white; margin-left: 6px; border-radius: 10px; padding: 2px 6px; font-size: 0.7rem; }

    /* Cards & List */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .total-display { font-size: 2rem; font-weight: 700; color: var(--primary); margin-top: 8px; }
    
    .expense-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: transform 0.1s; }
    .expense-item:hover { border-color: #cbd5e1; }
    .expense-item.is-paused { opacity: 0.6; filter: grayscale(50%); background: #f1f5f9; }
    .expense-info { display: flex; flex-direction: column; gap: 2px; }
    .expense-title { font-weight: 600; font-size: 1rem; }
    .expense-meta { font-size: 0.8rem; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
    .expense-amount { font-weight: 700; font-size: 1.1rem; }

    /* Drawer / Overlay */
    .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; justify-content: flex-end; z-index: 1000; }
    .overlay.active { display: flex; }
    .drawer { width: 100%; max-width: 400px; background: var(--surface); height: 100%; padding: 24px; display: flex; flex-direction: column; gap: 16px; box-shadow: -4px 0 15px rgba(0,0,0,0.1); }
    .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .drawer-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }

    /* Form Controls */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    .form-control { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; }

    /* Confirm Modal */
    .modal-center { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); display: none; justify-content: center; align-items: center; z-index: 1100; }
    .modal-center.active { display: flex; }
    .modal-box { background: var(--surface); border-radius: 8px; padding: 24px; width: 90%; max-width: 360px; text-align: center; }
    .modal-actions { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
      <div class="header-actions">
        <button id="trash-trigger" class="btn btn-secondary">
          Trash <span id="trash-count" class="badge-count">0</span>
        </button>
        <button id="add-btn" class="btn btn-primary">+ Add Expense</button>
      </div>
    </header>

    <!-- Summary -->
    <div class="card">
      <h3>Total Active Expenses</h3>
      <div id="total-amount" class="total-display">$0.00</div>
    </div>

    <!-- Expense List -->
    <h3>Expenses</h3>
    <ul id="expense-list" class="expense-list" style="margin-top: 12px;"></ul>
  </div>

  <!-- Add / Edit Drawer -->
  <div id="edit-modal-overlay" class="overlay">
    <div class="drawer">
      <div class="drawer-header">
        <h2 id="modal-title">Expense Details</h2>
        <button id="close-drawer" class="btn btn-secondary" style="padding: 4px 10px;">✕</button>
      </div>
      <form id="expense-form" style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
        <input type="hidden" id="expense-id">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <input type="number" step="0.01" id="amount" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" class="form-control">
            <option value="General">General</option>
            <option value="Food">Food</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
          </select>
        </div>

        <div style="margin-top: auto;">
          <div class="drawer-actions">
            <button type="button" id="delete-view-btn" class="btn btn-danger">Delete</button>
            <button type="button" id="archive-view-btn" class="btn btn-secondary">Pause Expense</button>
            <button type="submit" id="save-view-btn" class="btn btn-primary">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Trash Drawer -->
  <div id="trash-modal-overlay" class="overlay">
    <div class="drawer">
      <div class="drawer-header">
        <h2>Trash</h2>
        <button id="close-trash" class="btn btn-secondary" style="padding: 4px 10px;">✕</button>
      </div>
      <div style="flex: 1; overflow-y: auto;">
        <ul id="trash-list" class="expense-list"></ul>
      </div>
      <button id="empty-trash-btn" class="btn btn-danger" style="width: 100%; margin-top: 12px;">Empty Trash Permanently</button>
    </div>
  </div>

  <!-- Confirm Dialog Modal -->
  <div id="confirm-modal" class="modal-center">
    <div class="modal-box">
      <h3 id="confirm-title">Are you sure?</h3>
      <p id="confirm-msg" style="margin-top: 8px; color: var(--text-muted); font-size: 0.9rem;"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // Storage Logic
    const Store = {
      getExpenses() {
        return JSON.parse(localStorage.getItem('expenses') || '[]');
      },
      saveExpenses(expenses) {
        localStorage.setItem('expenses', JSON.stringify(expenses));
      },
      visibleExpenses() {
        return this.getExpenses().filter(e => !e.isTrashed);
      },
      chartExpenses() {
        return this.visibleExpenses().filter(e => !e.isArchived);
      },
      trashedExpenses() {
        return this.getExpenses().filter(e => e.isTrashed);
      },
      total() {
        return this.chartExpenses().reduce((sum, e) => sum + parseFloat(e.amount || 0), 0);
      }
    };

    // DOM References
    const dom = {
      expenseList: document.getElementById('expense-list'),
      trashList: document.getElementById('trash-list'),
      totalAmount: document.getElementById('total-amount'),
      trashCount: document.getElementById('trash-count'),
      trashTrigger: document.getElementById('trash-trigger'),
      closeTrash: document.getElementById('close-trash'),
      trashModalOverlay: document.getElementById('trash-modal-overlay'),
      emptyTrashBtn: document.getElementById('empty-trash-btn'),
      addBtn: document.getElementById('add-btn'),
      editModalOverlay: document.getElementById('edit-modal-overlay'),
      closeDrawer: document.getElementById('close-drawer'),
      expenseForm: document.getElementById('expense-form'),
      expenseId: document.getElementById('expense-id'),
      title: document.getElementById('title'),
      amount: document.getElementById('amount'),
      category: document.getElementById('category'),
      deleteViewBtn: document.getElementById('delete-view-btn'),
      archiveViewBtn: document.getElementById('archive-view-btn'),
      saveViewBtn: document.getElementById('save-view-btn'),
      confirmModal: document.getElementById('confirm-modal'),
      confirmMsg: document.getElementById('confirm-msg'),
      confirmOk: document.getElementById('confirm-ok'),
      confirmCancel: document.getElementById('confirm-cancel')
    };

    let confirmCallback = null;

    function showConfirm(message, onConfirm) {
      dom.confirmMsg.textContent = message;
      dom.confirmModal.classList.add('active');
      confirmCallback = onConfirm;
    }

    // UI Controller
    const UI = {
      renderAll() {
        this.renderExpenses();
        this.renderTrash();
        this.renderTotal();
      },

      renderTotal() {
        dom.totalAmount.textContent = `$${Store.total().toFixed(2)}`;
      },

      renderExpenses() {
        const list = Store.visibleExpenses();
        dom.expenseList.innerHTML = list.length === 0 
          ? '<li style="text-align:center; padding: 20px; color: var(--text-muted);">No expenses found.</li>'
          : list.map(item => `
            <li class="expense-item ${item.isArchived ? 'is-paused' : ''}" onclick="UI.openEdit('${item.id}')">
              <div class="expense-info">
                <span class="expense-title">${item.title}</span>
                <div class="expense-meta">
                  <span>${item.category}</span>
                  ${item.isArchived ? '<span class="badge badge-paused">Paused</span>' : ''}
                </div>
              </div>
              <span class="expense-amount">$${parseFloat(item.amount).toFixed(2)}</span>
            </li>
          `).join('');
      },

      renderTrash() {
        const trashed = Store.trashedExpenses();
        dom.trashCount.textContent = trashed.length;
        dom.trashList.innerHTML = trashed.length === 0
          ? '<li style="text-align:center; padding: 20px; color: var(--text-muted);">Trash is empty.</li>'
          : trashed.map(item => `
            <li class="expense-item">
              <div class="expense-info">
                <span class="expense-title">${item.title}</span>
                <span class="expense-meta">$${parseFloat(item.amount).toFixed(2)}</span>
              </div>
              <button class="btn btn-secondary" onclick="UI.restoreExpense('${item.id}')">Restore</button>
            </li>
          `).join('');
      },

      openAdd() {
        dom.expenseId.value = '';
        dom.expenseForm.reset();
        dom.deleteViewBtn.style.display = 'none';
        dom.archiveViewBtn.style.display = 'none';
        dom.editModalOverlay.classList.add('active');
      },

      openEdit(id) {
        const expenses = Store.getExpenses();
        const item = expenses.find(e => e.id === id);
        if (!item) return;

        dom.expenseId.value = item.id;
        dom.title.value = item.title;
        dom.amount.value = item.amount;
        dom.category.value = item.category || 'General';

        dom.deleteViewBtn.style.display = 'inline-block';
        dom.archiveViewBtn.style.display = 'inline-block';
        dom.archiveViewBtn.textContent = item.isArchived ? 'Resume Expense' : 'Pause Expense';

        dom.editModalOverlay.classList.add('active');
      },

      closeEdit() {
        dom.editModalOverlay.classList.remove('active');
      },

      togglePause(id) {
        const expenses = Store.getExpenses();
        const item = expenses.find(e => e.id === id);
        if (item) {
          item.isArchived = !item.isArchived;
          Store.saveExpenses(expenses);
          this.closeEdit();
          this.renderAll();
        }
      },

      moveToTrash(id) {
        showConfirm('Move this expense to trash?', () => {
          const expenses = Store.getExpenses();
          const item = expenses.find(e => e.id === id);
          if (item) {
            item.isTrashed = true;
            Store.saveExpenses(expenses);
            this.closeEdit();
            this.renderAll();
          }
        });
      },

      restoreExpense(id) {
        const expenses = Store.getExpenses();
        const item = expenses.find(e => e.id === id);
        if (item) {
          item.isTrashed = false;
          Store.saveExpenses(expenses);
          this.renderAll();
        }
      },

      emptyTrash() {
        if (Store.trashedExpenses().length === 0) return;
        showConfirm('Permanently delete all items in trash?', () => {
          const remaining = Store.getExpenses().filter(e => !e.isTrashed);
          Store.saveExpenses(remaining);
          this.renderAll();
        });
      }
    };

    // Event Listeners
    dom.addBtn.addEventListener('click', () => UI.openAdd());
    dom.closeDrawer.addEventListener('click', () => UI.closeEdit());

    dom.trashTrigger.addEventListener('click', () => dom.trashModalOverlay.classList.add('active'));
    dom.closeTrash.addEventListener('click', () => dom.trashModalOverlay.classList.remove('active'));
    dom.emptyTrashBtn.addEventListener('click', () => UI.emptyTrash());

    dom.confirmCancel.addEventListener('click', () => {
      dom.confirmModal.classList.remove('active');
      confirmCallback = null;
    });

    dom.confirmOk.addEventListener('click', () => {
      if (confirmCallback) confirmCallback();
      dom.confirmModal.classList.remove('active');
      confirmCallback = null;
    });

    dom.archiveViewBtn.addEventListener('click', () => {
      const id = dom.expenseId.value;
      if (id) UI.togglePause(id);
    });

    dom.deleteViewBtn.addEventListener('click', () => {
      const id = dom.expenseId.value;
      if (id) UI.moveToTrash(id);
    });

    dom.expenseForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = dom.expenseId.value;
      const expenses = Store.getExpenses();

      if (id) {
        const item = expenses.find(e => e.id === id);
        if (item) {
          item.title = dom.title.value;
          item.amount = parseFloat(dom.amount.value);
          item.category = dom.category.value;
        }
      } else {
        expenses.push({
          id: Date.now().toString(),
          title: dom.title.value,
          amount: parseFloat(dom.amount.value),
          category: dom.category.value,
          isArchived: false,
          isTrashed: false
        });
      }

      Store.saveExpenses(expenses);
      UI.closeEdit();
      UI.renderAll();
    });

    // Initialize App
    UI.renderAll();
  </script>
</body>
</html>
